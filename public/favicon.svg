<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="NES cartridge">
  <defs>
    <linearGradient id="shell" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8bcc4"/>
      <stop offset="45%" stop-color="#8f95a0"/>
      <stop offset="100%" stop-color="#6d7380"/>
    </linearGradient>
    <linearGradient id="contacts" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4a84b"/>
      <stop offset="100%" stop-color="#9a6f1e"/>
    </linearGradient>
  </defs>
  <!-- subtle shadow -->
  <rect x="5" y="4" width="22" height="25" rx="2" fill="#0b1020" opacity="0.35"/>
  <!-- main cartridge body -->
  <rect x="5" y="3" width="22" height="25" rx="2" fill="url(#shell)" stroke="#4b5563" stroke-width="0.75"/>
  <!-- top grip ridge -->
  <rect x="8" y="4.5" width="16" height="3" rx="0.5" fill="#a1a6b0" stroke="#5c6370" stroke-width="0.4"/>
  <!-- label window -->
  <rect x="7.5" y="9" width="17" height="10" rx="1" fill="#1a1d24" stroke="#2d3340" stroke-width="0.5"/>
  <!-- classic red stripe on label -->
  <rect x="8" y="11" width="15" height="1.2" rx="0.3" fill="#c41e3a"/>
  <rect x="8" y="13.2" width="11" height="0.9" rx="0.2" fill="#3d4451" opacity="0.9"/>
  <rect x="8" y="14.8" width="13" height="0.9" rx="0.2" fill="#3d4451" opacity="0.7"/>
  <!-- bottom slot / plastic -->
  <rect x="6" y="20" width="20" height="3.5" rx="0.5" fill="#7a808c" stroke="#5c6370" stroke-width="0.4"/>
  <!-- gold contacts -->
  <rect x="7" y="23.5" width="18" height="3.2" rx="0.4" fill="url(#contacts)" stroke="#6b4f18" stroke-width="0.35"/>
  <g fill="#5c4010" opacity="0.55">
    <rect x="8.2" y="24" width="1.1" height="2.4" rx="0.15"/>
    <rect x="10.1" y="24" width="1.1" height="2.4" rx="0.15"/>
    <rect x="12" y="24" width="1.1" height="2.4" rx="0.15"/>
    <rect x="13.9" y="24" width="1.1" height="2.4" rx="0.15"/>
    <rect x="15.8" y="24" width="1.1" height="2.4" rx="0.15"/>
    <rect x="17.7" y="24" width="1.1" height="2.4" rx="0.15"/>
    <rect x="19.6" y="24" width="1.1" height="2.4" rx="0.15"/>
    <rect x="21.5" y="24" width="1.1" height="2.4" rx="0.15"/>
    <rect x="23.4" y="24" width="1.1" height="2.4" rx="0.15"/>
  </g>
  <!-- side bevel hint -->
  <path d="M5.5 6v20" stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.6"/>
  <path d="M26.5 6v20" stroke="#000000" stroke-opacity="0.15" stroke-width="0.6"/>
</svg>
